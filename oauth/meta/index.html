<script>(function(){var q=new URLSearchParams(location.search),o=new URLSearchParams();['code','state','error','error_reason','error_description'].forEach(function(k){var v=q.get(k);if(v!==null&&v.length<4096)o.set(k,v)});history.replaceState(null,'',location.pathname);if(!o.has('state'))return;var t='http://127.0.0.1:3150/api/accounts/meta/callback?'+o.toString();document.getElementById('go').href=t;location.replace(t)})();</script>
